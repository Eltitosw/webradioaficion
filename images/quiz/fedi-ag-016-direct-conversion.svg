  <g stroke="#9aa3b5" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
    <line x1="130" y1="121" x2="175" y2="121"/>
    <line x1="280" y1="121" x2="325" y2="121"/>
    <line x1="445" y1="121" x2="490" y2="121"/>
    <line x1="227" y1="178" x2="227" y2="148"/>
