    <text x="385" y="126" fill="#e8ecf4">Audiofrecuencia</text>
    <rect x="490" y="95" width="95" height="52" rx="7" fill="#161d2a" stroke="#7eb6ff" stroke-width="1.5"/>
    <text x="537" y="126" fill="#e8ecf4">Altavoz</text>
